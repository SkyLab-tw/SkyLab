# 課程（/courses/:classId）
id: course
path: /courses/:classId
title: 課程
access: learner
order: 30
purpose: 單一課程（你所在的班級）的任務、本週進度與課堂機器入口。
when_to_use: 上課或做作業時，要看這門課現在要做什麼、到哪一週，以及連進課堂機器。
sections:
  - 老師已發布的任務
  - 本週進度
  - 你的課堂機器
features:
  - 「老師已發布的任務」依週列出老師已發布的每週內容（日期還沒到的週也會列出），以及發布日期在今天以前的 AI 導師檢查任務；每一列寫第幾週、日期與檢查項目數。有週次的那一列點一下進入該週的內容頁，沒有對應週次的任務則是展開看任務要求；老師有回覆時會標「老師有回覆」。
  - 這週有 AI 導師檢查任務時才有勾選框，勾了就是「標記本週完成」，只記錄你的完成狀態，不會啟動 AI 導師檢查；再按一次可以取消。勾選後這一列會展開，列出 AI 整理的任務重點與每個檢查項目，要等老師的項目會標「AI 輔助＋老師確認」或「老師人工確認」。
  - 「本週進度」顯示本週的上課時間、老師、教室、檢查通過幾項與老師回覆，這週有任務時另外標「本週已完成」或「本週未完成」；按「查看本週」進入本週內容。老師還沒發布任何每週內容時顯示「還沒有每週內容」。
  - 「你的課堂機器」（這門課有課堂機器才出現）點機器就會連進去（虛擬機開主控台、容器開終端機）；機器關機時按鈕顯示「啟動並進入」，會先自動開機再連線；機器還沒建好時顯示「環境配置中」、不能點。資訊鈕前往這台機器的資源詳情頁。
  - 按「返回我的課程」回到課程列表。
elements:
  - id: course.tasks
    role: list
    label: 老師已發布的任務
    help: 依週列出老師已發布的每週內容，以及老師發布並核准、發布日期在今天以前的 AI 導師檢查任務；兩者都沒有時顯示「老師還沒有發布任務」。
    section: 老師已發布的任務
  - id: course.mark_week_done
    role: toggle
    label: 標記本週完成
    help: 一個勾代表這週的任務全部做完；只記錄完成狀態，不會啟動 AI 導師檢查。這週沒有 AI 導師檢查任務（例如只放教材）時沒有這個勾選框。
    section: 老師已發布的任務
  - id: course.this_week
    role: readonly
    label: 本週進度
    help: 上課日期在今天以前的最後一週；學期還沒開始時顯示第一週。
    section: 本週進度
  - id: course.open_week
    role: button
    label: 查看本週
    help: 進入本週的檢查回饋、課堂機器與教材。
    section: 本週進度
  - id: course.machines
    role: list
    label: 你的課堂機器
    help: 直接點機器就能進入主控台或終端機，關機中的會先開機。
    section: 你的課堂機器
related:
  - path: /my-resources
    when: 機器要關機、重開或查看完整設定
