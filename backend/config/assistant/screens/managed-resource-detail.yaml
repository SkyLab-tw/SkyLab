# 資源詳細（/resource-mgmt/:vmid）
# 與使用者的資源詳情頁是同一個頁面元件（ResourceDetailPage，只差返回的清單），
# 彈出視窗沿用 resource-detail。extends 是「這個檔有寫的鍵整個蓋掉被繼承的那一份」，不會
# 逐條合併：下面的 features 就是這一頁完整的功能說明，resource-detail 的 features 不會帶
# 過來。使用者那一頁的功能有變動時，這裡要跟著補。
extends: resource-detail
id: managed-resource-detail
path: /resource-mgmt/:vmid
title: 資源詳情
access: admin
order: 260
purpose: 管理員檢視與操作單一台機器；調整規格可以直接套用，不必送申請。
when_to_use: 管理員要細看或調整某一台機器的監控、規格、快照、備份與進階設定。
sections:
  - 總覽
  - 監控
  - 規格
  - 快照
  - 備份
  - 操作紀錄
  - 進階設定
features:
  - 分頁與使用者看到的資源詳情頁相同：總覽、監控、規格、操作紀錄、進階設定；「快照」只在這台機器當下能做快照時出現，不能做快照、且所屬叢集設定了備份儲存空間時改出現「備份」。「操作紀錄」旁標著紀錄筆數；畫面太窄排不下時，放不下的分頁收進「更多」選單。
  - 「進階設定」有生命週期、防火牆（以這台機器為中心的拓撲圖與規則表，按「新增規則」加規則或發布對外服務；拓撲圖上可以拖動機器、從機器邊緣拉線開「新增連線」視窗，拖過的位置只影響這張圖、不會存起來）、開機選項（只有虛擬機）、登入憑證，以及共享與轉移（課堂機器沒有）。
  - 「規格」：管理員直接調 CPU 核心（1–32）、記憶體（0.5–64 GB，0.5 GB 一格）與磁碟（只能放大，不能小於目前大小），按「套用變更」立即生效，不必填申請原因，也不受配額限制；執行中的虛擬機需重開機後 CPU／記憶體才會生效。
  - 課堂與快速練習的機器照課程環境版本建立，「規格」分頁的欄位鎖住，管理員也無法個別調整。
  - 「快照」：管理員可以刪除系統偵測到疑似挖礦時自動建立的「存證」快照（一般使用者不能刪）；標「受保護」的初始快照不能刪除。
  - 「返回列表」回到資源管理的清單。
elements:
  - use: spec-change-elements
related:
  - path: /resource-mgmt
    when: 回到全站資源清單
  - path: /request-review
    when: 要審核使用者送來的規格調整或延長到期日申請
  - path: /jobs
    when: 要看備份、還原或重置任務的進度
