# 申請審核（/request-review）
id: request-review
path: /request-review
title: 申請審核
access: admin
order: 270
purpose: 集中審核使用者的機器建立申請與規格調整申請（含延長到期日）。AI API 金鑰申請與班級的批次建機有各自的審核頁，刪除請求不在這裡。
when_to_use: 有使用者送出機器建立、規格調整或延長到期日的申請，要決定核准或拒絕。
sections:
  - 待審核
  - 已通過
  - 已拒絕
  - 已過期
  - 全部
features:
  - 分頁切換「待審核」「已通過」「已拒絕」「已過期」「全部」，每個分頁標出筆數；視窗太窄放不下時，分頁會收成一顆顯示目前分頁的下拉按鈕，點開再選。搜尋框可以找主機、申請人或狀態，按 Esc 清空。
  - 「待審核」最多載入 1000 筆；其他分頁只列最新的 100 筆（建立申請與規格調整各自計算），更舊的不會出現在清單裡。
  - 清單新到舊排列，每筆標出申請類型（建立申請或規格調整）與申請人；延長到期日也走規格調整，標題寫「延長到期日」。
  - 點一筆申請，在詳細資料看申請類型、規格 / 摘要、時間、作業系統或變更類型、GPU、節點 / VMID 與申請原因 / 備註；已審過的會顯示審核備註與審核時間。
  - 待審核的申請可以填「審核備註」（選填，申請者看得到）後按「核准」或「拒絕」。
  - 建立申請要等資源評估讀完才能按「核准」（顯示「讀取資源評估中...」時不能按）；評估結果放不下時「核准」會停用，並寫出原因：這個時段沒有節點放得下這筆申請，或時段重疊的另一張已核准申請排不進任何節點（會寫出是哪一張，要先處理那張）。評估讀取失敗時「核准」也不能按，會寫「資源評估讀取失敗，所以暫時不能核准。」。規格調整的機器已經刪除時不能核准，畫面會寫「這台機器已經刪除，無法核准；請拒絕此申請。」。
  - 規格調整核准後，要等申請人自己按「套用」才會改規格；清單上會標「待申請人套用」「套用中」「已套用」或「套用失敗」，詳細資料的「套用結果」寫出結果或錯誤原因。
  - 勾選多筆待審核的申請後，工具列換成批量的「核准」與「拒絕」，會開確認視窗並共用一段審核備註；按住 Shift 點勾選框可以連選一段，已經有勾選時點待審核的那一列也是勾選、不會開詳細資料。批量核准從最早送出的申請開始一筆一筆送，資源不足等原因失敗的那幾筆保留勾選，原因標在該筆申請上。機器已刪除的規格調整在批量核准時會被略過（滑過批量「核准」會寫出略過幾筆）；勾選的全是這種申請時批量「核准」不能按。
elements:
  - id: reqreview.type
    role: readonly
    label: 申請類型
    help: 這裡有兩種：建立申請與規格調整（延長到期日也算規格調整）。
    section: 待審核
  - id: reqreview.spec
    role: readonly
    label: 規格 / 摘要
    help: 建立申請顯示要開的 CPU、記憶體與磁碟；規格調整顯示從什麼改成什麼，延長到期日顯示新舊到期日。
    section: 待審核
  - id: reqreview.node
    role: readonly
    label: 節點 / VMID
    help: 建立申請顯示評估後預計配到的節點（還沒評估顯示「尚未評估」）；規格調整顯示機器的 VMID。
    section: 待審核
  - id: reqreview.reason
    role: readonly
    label: 申請原因 / 備註
    help: 申請人填的理由，太長會收合，可按「顯示更多」展開。
    section: 待審核
  - id: reqreview.search
    role: text
    label: 搜尋主機、申請人或狀態
    help: 比對申請類型、主機或機器名稱、申請人姓名與 Email、畫面上顯示的狀態文字（例如「待審核」「待申請人套用」）、規格、時間與 GPU；只在目前分頁已載入的申請裡找，按 Esc 清空。
  - id: reqreview.comment
    role: textarea
    label: 審核備註
    help: 選填，可填核准原因或退回說明，申請者看得到。
    section: 待審核
  - id: reqreview.approve
    role: button
    label: 核准
    help: 建立申請要等資源評估讀完、而且放得下才能按，不能按時會一併寫出原因；規格調整的機器已刪除時不能按。
    section: 待審核
  - id: reqreview.reject
    role: button
    label: 拒絕
    section: 待審核
  - id: reqreview.status_expired
    role: readonly
    label: 已過期
    help: 使用時段結束前沒有審核的建立申請，或核准了卻到時段結束都沒開出機器的申請，會由系統標成已過期，不再需要審核。規格調整沒有這個狀態。
    section: 已過期
dialogs:
  - id: batch-approve
    title: "核准 {{count}} 筆申請？"
    opened_by: 核准
    purpose: 勾選多筆待審核申請後，一次核准並寫入同一段審核備註。
    fields:
      - label: 審核備註
        help: 選填，會寫進每一筆申請的審核備註；最多 2000 字。
    notes:
      - 視窗列出這次會核准的申請（最多列 5 筆，其餘寫「等 N 筆」），機器已刪除的規格調整不在名單裡；按「核准 N 筆」送出。
      - 從最早送出的申請開始一筆一筆送，後面的申請才看得到前面剛預留的資源；資源不夠時被擠掉的是後送出的申請。
      - 失敗的申請保留勾選，失敗原因標在該筆申請上，可以直接再試。
  - id: batch-reject
    title: "拒絕 {{count}} 筆申請？"
    opened_by: 拒絕
    purpose: 勾選多筆待審核申請後，一次拒絕並寫入同一段審核備註。
    fields:
      - label: 審核備註
        help: 選填，會寫進每一筆申請的審核備註；最多 2000 字。
    notes:
      - 視窗列出這次會拒絕的申請（最多列 5 筆，其餘寫「等 N 筆」）；按「拒絕 N 筆」送出。
      - 失敗的申請保留勾選，失敗原因標在該筆申請上。
related:
  - path: /batch-review
    when: 要審核老師為班級送出的批次建機
  - path: /ai-api-review
    when: 要審核 AI API 金鑰申請
  - path: /governance
    when: 審核時發現配額需要調整
  - path: /resource-mgmt
    when: 要看已核准的申請是否已經開通
