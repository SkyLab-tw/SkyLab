# 班級審核（/batch-review）
id: batch-review
path: /batch-review
title: 班級審核
access: admin
order: 280
purpose: 審核教師為班級提交的機器配置申請，同一個班級的機器節點一起審。
when_to_use: 老師送出班級建機後，要查看整批機器的內容並決定核准或駁回。
sections:
  - 待審核
  - 已通過
  - 已拒絕
  - 全部
features:
  - 分頁：「待審核」「已通過」「已拒絕」「全部」各自顯示筆數。「已通過」也包含等待中、建立中、已完成與失敗的批次；已取消的只出現在「全部」。視窗太窄放不下時，分頁會收成一顆顯示目前分頁的下拉按鈕，點開再選。
  - 搜尋：在「搜尋批次、申請人或課程」輸入關鍵字，比對批次名稱、申請人姓名與信箱、課程、資源類型與狀態，按 Esc 清空；沒有結果時可按「清除搜尋」。
  - 清單每列是一筆批次，顯示名稱、機器台數與申請人、狀態與提交時間，由新到舊排列。批次都屬於某個班級，同一個班級、同一個狀態的機器節點併成一列：有多個節點時名稱是「班級名稱 · N 個節點」，只有一個節點時是那個節點的主機名稱前綴。
  - 清單讀取失敗時會顯示錯誤，按「重試」重新讀取。
  - 點一筆批次看詳細：申請類型、課程、資源類型、VM 數量、規格 / 摘要、作業系統 / 範本、提交時間、申請人信箱、建立進度與批次成員。沒點選之前不會顯示任何批次，也不能審核。
  - 有週期排程的批次會顯示「每週…」的開機規則，按「查看未來時段」列出接下來 5 個開機時段。
  - 審核：待審核的批次可以填「審核備註」，再按「核准」或「駁回」，確認視窗（「核准批量申請」或「駁回批量申請」，內容寫「確定核准『班級名稱』的 N 個機器節點？」）再按一次；審核一律以班級為單位，同一個班級所有待審的機器節點一起處理。
  - 核准後系統立刻在背景開始建立機器，班級變成「正在建立」，「建立進度」顯示已建好與失敗的台數。駁回時如果還沒有任何機器建出來，班級退回「準備中」並放掉預留的資源；已經有機器建出來的，班級變成「需要處理」。
  - 已審核的批次會顯示審核備註、審核時間與審核者；沒填備註時顯示「未填寫備註」。
elements:
  - id: batchreview.search
    role: text
    label: 搜尋批次、申請人或課程
    help: 比對批次名稱、申請人姓名與信箱、課程、資源類型與畫面上的狀態文字；按 Esc 清空。
  - id: batchreview.type
    role: readonly
    label: 申請類型
    help: 顯示「班級批次」：同一個班級的機器節點，核准或駁回時一起處理。
  - id: batchreview.progress
    role: readonly
    label: 建立進度
    help: 這一批要建的機器裡已經建好幾台（已建好／總數），建立失敗的另外標出「N 台建立失敗」。核准後才會開始建立。
  - id: batchreview.recurrence
    role: readonly
    label: 週期排程
    help: 這批機器會依課表每週定時開機；按「查看未來時段」可以列出接下來 5 個開機時段再決定。
  - id: batchreview.members
    role: list
    label: 批次成員
    help: 這一批會替哪些學生建立機器；已建好的顯示 VMID，其餘顯示建立狀態。
  - id: batchreview.comment
    role: textarea
    label: 審核備註
    help: 選填，可填核准原因或退回說明，核准或駁回時一起送出。
    constraints:
      - 最多 500 字（輸入框打到 500 字就不能再打）
    section: 待審核
  - id: batchreview.approve
    role: button
    label: 核准
    help: 跳出「核准批量申請」確認後核准，系統立刻在背景開始建立機器。
    section: 待審核
  - id: batchreview.reject
    role: button
    label: 駁回
    help: 跳出「駁回批量申請」確認後駁回，不會再建立機器。
    section: 待審核
related:
  - path: /request-review
    when: 要審核個人的機器申請
  - path: /monitoring
    when: 核准前想確認叢集目前的負載
