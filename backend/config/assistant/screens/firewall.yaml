# 防火牆（/firewall）
id: firewall
path: /firewall
title: 防火牆
access: all
order: 130
purpose: 以拓撲圖管理機器之間與對外的網路連線規則，在節點之間拉出連線就是建立一條規則；點機器可以看與管理它的防火牆規則。
when_to_use: 要讓機器上網、讓兩台機器互通、把機器上的網站或服務開放給外部，或整體檢查目前開了哪些連線。
sections:
  - 拓撲圖
  - 連線規則
  - 機器規則
features:
  - 看得到哪些機器：管理員看得到全部機器；老師看得到自己的機器與自己班級學生的機器；學生只看得到自己的機器，其中課堂機器的防火牆由班級老師管理、只能查看。快速練習機器的防火牆不開放調整。
  - 拓撲圖上每個節點是一台機器，「網際網路」節點代表外部；每條線是一條連線，圖例分成「對外開放」「對外連線」「內部互通」。點節點看它的防火牆規則，點線看「連線內容」。拓撲每 30 秒自動更新。
  - 節點上有機器名稱與 IP（沒有 IP 時顯示 vmid）；老師看學生的課堂機器時，節點主標是學生姓名。名稱或 IP 太長被截斷時，滑過可以看完整內容（老師視角是「學生姓名 · 主機名稱」）。有對外開放服務的機器會標出開放的數量。
  - 新增連線：按「新增連線」開啟設定視窗；也可以從一個節點拖拉到另一個節點，系統會依兩端帶入連線方式（從網際網路拉到機器是開放服務給外部，機器拉到網際網路是讓機器能上網，機器拉到機器是讓兩台機器互通）。任一端是你不能管理的機器時會直接提示原因（課堂機器由班級老師管理、快速練習機器不開放調整，或你沒有管理權），不會開視窗。
  - 檢視切換（只影響畫面、不改規則）：「自動排列」重新排好節點（分組時這顆變成「重設位置」）；「分組」把機器依班級或機器類型包成可收合的群組，機器達 12 台時預設分組；「連線標籤」在線上顯示開放的 port 或網址；「上網線」顯示機器連到網際網路的出站線（預設隱藏）；「地圖」顯示縮圖；「只看對外開放」只留有從網際網路開進來的機器。
  - 連線標籤會自動避開機器與其他標籤：先沿著自己的線找空位，整條線都被擋住時移到旁邊，並拉一條細線指回所屬的線。機器上網的出站線（不限通訊埠）不常駐標籤，滑過或選中時才顯示。
  - 分組模式：只有一台機器的班級或類型不畫框；機器超過 20 台時，沒有對外開放服務的群組預設收合。收合的群組是一張摘要卡（台數、開機台數、規則數、對外開放數），群組往外的連線併成一條、標「N 條連線」，點那條線會展開群組；收合的群組不能拉線，要展開後從單台機器拉。搜尋時群組全部展開，不能收合。
  - 篩選：搜尋機器名稱或 IP，有多個群組時可以用「全部群組」選單只看某一組；有機器被篩掉時會顯示「另有 N 台未顯示」，按「清除篩選」恢復。
  - 拖動節點可以調整位置，沒有管理權的機器也能拖，只是不能從它拉線建立連線。放得離別台太近時，會自動推開到最近的空處。不分組時，位置會存起來，下次進來維持。
  - 分組模式下，群組框、框內的機器、只有一台的群組與網際網路節點都能拖；框內的機器可以拖出框外，群組框會跟著長大並重新貼合框內的機器，長大後蓋到的其他群組會自動讓開。分組時拖過的位置只記在這台瀏覽器，按「重設位置」回到預設排列。
  - 點節點開啟這台機器的規則面板：看「防火牆設定」（狀態、預設入站、預設出站）與規則清單；自己加的規則可以用開關停用或按刪除（會先確認），鎖頭標記的是 SkyLab 受管規則，由連線與對外發布管理、不能在這裡改；按「新增規則」替這台機器加規則；「前往資源詳情（迷你拓撲與對外服務）」開啟這台機器的資源詳情頁。沒有管理權的機器只能看規則，面板會說明原因（課堂機器找班級老師、快速練習機器不開放調整，或你沒有管理權）。選中機器時圖上只畫跟它有關的線，按「取消選取」恢復。
  - 點線開啟「連線內容」：看兩端、方向（單向／雙向）、開放內容與發布方式（網址發布、通訊埠轉發、僅開放防火牆）；網址發布的那一列會寫出轉到機器的 port 與協定（例如 8080/tcp），可以開啟網址，能管理目標機器時可切換「讓搜尋引擎收錄」。
  - 刪除連線：在「連線內容」按「刪除連線」並確認；由環境模板管理的連線、或另一端是你沒有管理權的機器時不能刪，面板會寫原因。
elements:
  - id: firewall.topology
    role: list
    label: 拓撲圖
    help: 機器與連線規則會畫在這張圖上；建立 VM 之後才會出現節點，一台都沒有時顯示「目前沒有可顯示的防火牆資源」。
    section: 拓撲圖
  - id: firewall.add_connection
    role: button
    label: 新增連線
    help: 開啟設定視窗選擇要做什麼；也可以直接從一個節點拖拉到另一個節點建立連線。
    section: 連線規則
  - id: firewall.connection_labels
    role: toggle
    label: 連線標籤
    help: 切換是否在線上常駐顯示開放的 port 或網址，預設開啟；滑過或選中的線一律顯示。標籤會避開機器與其他標籤，線上放不下時移到旁邊、拉一條細線指回所屬的線；機器上網的出站線不常駐標籤。
    section: 拓撲圖
  - id: firewall.auto_arrange
    role: button
    label: 自動排列
    help: 重新排列節點並存下新位置，只影響檢視，不改動規則；分組模式下這顆是「重設位置」，丟掉拖過的群組框與框內機器位置，回到預設排列。
    section: 拓撲圖
  - id: firewall.group_toggle
    role: toggle
    label: 分組
    help: 有班級的機器依班級、其他依機器類型包成群組，可以展開或收合；機器達 12 台時預設分組，超過 20 台時沒有對外開放的群組預設收合。分組時群組框與框內機器都能拖，位置只記在這台瀏覽器。
    section: 拓撲圖
  - id: firewall.internet_lines
    role: toggle
    label: 上網線
    help: 顯示或隱藏機器連到網際網路的出站線，預設隱藏；對外開放的線不受影響。
    section: 拓撲圖
  - id: firewall.only_exposed
    role: toggle
    label: 只看對外開放
    help: 只顯示有從網際網路開進來的服務的機器。
    section: 拓撲圖
  - id: firewall.search
    role: text
    label: 搜尋機器名稱或 IP
    help: 依名稱或 IP 篩選圖上的機器；被篩掉的台數會另外顯示。
    section: 拓撲圖
  - id: firewall.delete_connection
    role: button
    label: 刪除連線
    help: 在「連線內容」裡，按下會先確認再刪除這條連線規則；由環境模板管理、或另一端是你沒有管理權的機器時不會出現。
    section: 連線規則
  - id: firewall.allow_indexing
    role: toggle
    label: 讓搜尋引擎收錄
    help: 網址發布的連線在「連線內容」裡可以切換，一切換就生效；開啟後 Google 等搜尋引擎可以把網址列進搜尋結果，關閉時平台會請搜尋引擎不要收錄。只有能管理目標機器時才出現。
    section: 連線規則
  - id: firewall.add_rule
    role: button
    label: 新增規則
    help: 在機器的規則面板裡，替這台機器加一條規則；沒有管理權的機器（學生的課堂機器、快速練習機器等）沒有這顆按鈕。
    section: 機器規則
dialogs:
  - id: connection
    title: 新增連線
    opened_by: 新增連線
    purpose: 建立一條連線規則：上網、互通、對外發布服務，或自訂規則。
    use: connection-dialog
  - id: firewall-rule
    title: 新增防火牆規則
    opened_by: 新增規則
    purpose: 從機器的規則面板開啟，機器固定是這台、預先選好「自己寫規則」；也可以改選其他連線方式。
    use: connection-dialog
related:
  - path: /my-resources
    when: 要先確認服務已在機器裡跑起來
  - path: /domain
    when: （管理員）新增連線時沒有「用網址」可選，要先接上 Cloudflare 網域
  - path: /gateway
    when: （管理員）新增連線時沒有「用網址」可選，要先完成 Gateway 設定
