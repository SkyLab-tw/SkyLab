# AI 導師檢查（/class-management/:classId/ai）
# AI 導師檢查是獨立頁面，order 要排在 class-workspace-section 前面：
# 前端與後端都取第一個符合的路徑樣板，/class-management/42/ai 兩個都配得上。
id: ai-judge
path: /class-management/:classId/ai
title: AI 導師檢查
access: staff
order: 180
purpose: 替班級每一週建立檢查表，讓 AI 產生檢查腳本並在每位學生的機器上執行，再由老師核查結果、回覆學生。
when_to_use: 想用 AI 導師檢查處理全班學生機器上的作業（例如環境有沒有裝好、服務有沒有跑起來），再由老師核查結果。
sections:
  - 週次
  - 任務設定
  - 導師核查
features:
  - 班級要通過審核、所有學生機器都建好（可以上課）才能用；還沒好時這一頁只顯示「AI 導師檢查尚未開放」。
  - 週次清單列出班級每一週，一週一份檢查，每週標示「已建立檢查」或「尚未建立檢查」，還沒發布的週次會標「未發布」；還沒有檢查的週次按「建立這週的檢查」。已建立檢查的週次有「更多功能」選單（⋮）：「移到其他週」、「複製到其他週」或「刪除」。視窗較窄時只顯示目前這一週：按「上一週」、「下一週」換到相鄰的週，或點目前這週從清單挑一週。
  - 「任務設定」：在「AI 導師檢查」對話描述想檢查的內容，或附上評分表檔案（.md、.txt、.doc、.docx、.pdf，可以直接拖進來），AI 會提出檢查項目；對話裡會用一行總結這次的結果，例如「已建立 3 項提案」「已送出 2 項修改提案」，沒建立成功的才逐項列出（「提案未建立：…」「內容未變更，未建立提案：…」）。在「AI 提案」勾選要的項目按「同意套用」才會寫進檢查表，不要就按「忽略」。
  - 「檢查項目」表格的檢查點名稱可以直接改，改了會自動儲存；檢測方式由 AI 產生、只能看，「檢測方式」欄名附帶的 ⓘ 按鈕點開會說明「由 AI 產生，僅供檢視；要調整請告訴 AI 導師檢查。」（點別處或按 Esc 收起）。點一項的整列或展開鈕，檢測方式會接著列出在哪台機器檢查與每個檢查步驟；缺少資訊時列出缺什麼，需要導師核查、或有「腳本無法檢查時」的做法也寫在這裡，什麼都沒有時顯示「AI 尚未提供檢測方式，這一項目前以人工確認為主。」每一項標示「可自動檢查」、「缺少資訊」、「導師核查／無法執行」或「導師檢查」。
  - 按「製作腳本」會先儲存並請 AI 核對全部項目，通過後自動製作檢查腳本並切到「導師核查」；有 AI 提案還沒處理或還沒有任何檢查項目時不能製作；AI 核對發現項目缺少資訊時不會製作，要先向 AI 補充說明，再按「製作腳本」重新核對。
  - 「導師核查」：看全班學生是否打勾完成、檢查通過或未通過；可以按「檢查已回報的學生」只檢查回報完成的人、展開學生按「檢查這位學生」，或按「一次執行」檢查全班。機器要開著才能檢查。可以用「排序」切換待處理優先或依學號／帳號排列。
  - 要有製作好的檢查腳本，而且這週內容已在班級的「每週內容」發布，才能執行檢查；發布後學生也才看得到這週的作業。
  - 展開學生可以看每台機器的檢查結果與原始證據；需要老師判斷的項目按「通過」或「未通過」。重新檢查已核查過的學生會換成新結果，原本的核查不再顯示（給學生的回覆會保留）。
  - 可以給每位學生這週一則回覆（選填）；按「儲存」會一起儲存檢查判定與回覆，再回覆會覆蓋前一則，學生在這週的頁面看得到。
elements:
  - id: aijudge.weeks
    role: list
    label: 週次
    help: 列出班級每一週，一週一份檢查；還沒有檢查的週次按「建立這週的檢查」。
    section: 週次
  - id: aijudge.create_week_check
    role: button
    label: 建立這週的檢查
    help: 替目前選的這一週建立一份檢查，接著在「任務設定」請 AI 導師檢查整理要檢查的項目。
    section: 週次
  - id: aijudge.week_menu
    role: button
    label: 更多功能
    help: 已建立檢查的週次才有的 ⋮ 按鈕：移到其他週、複製到其他週、刪除。每一週都已經有檢查時，移動與複製不能用。
    section: 週次
  - id: aijudge.tab_rubrics
    role: list
    label: 任務設定
    help: 請 AI 導師檢查整理這週要檢查的項目，再按「製作腳本」產生檢查腳本。
    section: 任務設定
  - id: aijudge.assistant
    role: textarea
    label: AI 導師檢查
    help: 跟 AI 描述想檢查的內容或附上評分表，它會提出檢查項目；Enter 送出、Shift+Enter 換行。「清除內容」會清掉這個檢查的對話、待送出的附件與尚未套用的提案，檢查表本身不受影響。
    constraints:
      - 附件只能是 .md、.txt、.doc、.docx、.pdf。
    section: 任務設定
  - id: aijudge.proposal
    role: list
    label: AI 提案
    help: AI 建議新增、修改或刪除的檢查項目；AI 建立提案後，對話裡會顯示「已建立 N 項提案」或「已送出 N 項修改提案」。只有勾選後按「同意套用」的項目才會保存到檢查表，按「忽略」則整份不套用。
    section: 任務設定
  - id: aijudge.rubric_items
    role: table
    label: 檢查項目
    help: 欄位有檢查點、檢測方式與自動檢測支援；檢查點名稱可以直接改或刪除該項（刪除會立即儲存、無法復原）。展開一項後，檢測方式會接著列出檢查機器、檢查步驟，以及缺少的資訊、判定方式或腳本無法檢查時的做法，這些都由 AI 產生、只能看。
    section: 任務設定
  - id: aijudge.method_info
    role: button
    label: 檢測方式
    help: 「檢測方式」欄名附帶的 ⓘ 按鈕，點開會說明「由 AI 產生，僅供檢視；要調整請告訴 AI 導師檢查。」，點別處或按 Esc 收起。
    section: 任務設定
  - id: aijudge.save_build
    role: button
    label: 製作腳本
    help: 先儲存並核對全部項目；通過後自動保存核對結果、製作腳本，並前往導師核查。
    constraints:
      - 要先有至少一個檢查項目，而且 AI 提案已經同意套用或忽略。
      - 檢查表有未儲存的修改時，會先重試儲存，存好才開始製作。
    section: 任務設定
  - id: aijudge.tab_review
    role: list
    label: 導師核查
    help: 看全班學生是否打勾完成、檢查通過或未通過，並給每位學生這週的回覆。
    section: 導師核查
  - id: aijudge.run_ready
    role: button
    label: 檢查已回報的學生
    help: 只檢查回報完成的學生，括號裡是人數；其他人的結果不會被蓋掉。
    section: 導師核查
  - id: aijudge.run_all
    role: button
    label: 一次執行
    help: 在每位學生的對應機器上執行這週的檢查腳本；週次要先發布、要有製作好的檢查腳本、機器要開著才能檢查。
    section: 導師核查
  - id: aijudge.run_student
    role: button
    label: 檢查這位學生
    help: 展開學生後才看得到，只重新檢查這一位。
    section: 導師核查
  - id: aijudge.reply
    role: textarea
    label: 給這位學生的本週回覆
    help: 選填，學生會在本週頁面看到；按「儲存」或 Ctrl+Enter 儲存，再回覆會覆蓋前一則。
    constraints:
      - 最多 4000 字。
    section: 導師核查
dialogs:
  - id: run-all
    title: 一次執行整組檢查點
    opened_by: 一次執行
    purpose: 在每位學生的對應機器上執行全部檢查腳本。
    fields:
      - label: 執行範圍
        help: 列出每位學生會被檢查的機器，只是確認用，不用填。
    notes:
      - 用目前生效的那一版檢查腳本執行，不用另外選；檢查表改過要先重新「製作腳本」才會換新版。
      - 沒開機的學生會列為未執行。
      - 已經核查過的學生重新檢查後會換成新結果，原本的核查不再顯示；給學生的回覆會保留。
      - 按「確認執行」開始。還沒有任何結果時，這個視窗也可以從「一次執行整組檢查點」按鈕開啟。
  - id: move-week
    title: 移到其他週
    opened_by: 移到其他週
    purpose: 把這週的檢查整份移到另一個還沒有檢查的週次，學生會在那一週看到它。
    fields:
      - label: 目標週次
        help: 只能選還沒有檢查的週次。
        required: true
    notes:
      - 按「儲存週次」完成移動。
  - id: copy-week
    title: 複製到其他週
    opened_by: 複製到其他週
    purpose: 把這週的檢查表複製一份到另一個還沒有檢查的週次。
    fields:
      - label: 目標週次
        help: 只能選還沒有檢查的週次。
        required: true
    notes:
      - 對話紀錄、腳本與執行結果不會複製。
      - 按「複製」完成，畫面會切到新的那一週。
related:
  - path: /class-management
    when: 回到班級清單
