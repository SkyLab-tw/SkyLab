# 資源詳細（/my-resources/:vmid）
id: resource-detail
path: /my-resources/:vmid
title: 資源詳情
access: all
order: 60
purpose: 單一台機器的完整資訊與設定，也是提出規格調整與延長到期日申請的地方；送出的申請要等管理員審核。
when_to_use: 要針對單一台機器做細部設定：看監控、調規格、建快照或備份、改防火牆或登入憑證、延長到期日、共享給別人。
sections:
  - 總覽
  - 監控
  - 規格
  - 快照
  - 備份
  - 操作紀錄
  - 進階設定
features:
  - 分頁有「總覽」「監控」「規格」「快照」或「備份」「操作紀錄」「進階設定」；「操作紀錄」旁標著紀錄筆數。畫面太窄排不下時，放不下的分頁收進「更多」選單，目前所在的分頁一定排在外面。
  - 「總覽」：資源用量（CPU 核心、記憶體、磁碟、運行時間）、環境資訊（節點、環境類型、作業系統、到期日、使用時段、自動關機、預定刪除、存取身分等）、連線與憑證（IP 位址、對外網址、帳號、密碼、公鑰與私鑰，可複製或下載）；範本附有使用手冊時可以下載。
  - 「監控」：目前的 CPU 用量、記憶體、磁碟與網路，以及 CPU、記憶體、網路的歷史趨勢圖，可切換最近 1 小時、1 天、1 週、1 月、1 年。
  - 「規格」：調 CPU 核心、記憶體與磁碟（磁碟只能放大），可調範圍受剩餘配額限制；填「申請原因」後按「送出申請」等管理員審核。審核通過後按「套用新規格」，執行中的機器會先關機、套用後再自動開機（容器的 CPU／記憶體可線上生效，不會重開），過程約 1～3 分鐘。
  - 同一台機器一次只能有一張處理中的規格調整申請，處理完或按「撤銷申請」後才能再送；課堂與快速練習的機器規格由老師在教學環境裡決定，不能個別調整。
  - 「快照」：只在這台機器的儲存空間支援快照時出現。「建立快照」保存目前磁碟狀態，每一筆可以「還原」或「刪除」；有初始快照時可以「一鍵重置」回到初始狀態（機器會還原並重新開機），還沒有初始快照時可以按「建立初始快照」。標「受保護」的初始快照與標「存證」的快照不能刪除。
  - 「備份」：儲存空間不支援快照、且所屬叢集設定了備份儲存空間時，改用備份當還原點；可以「建立備份」、「還原」與「刪除」，建立與還原都要幾分鐘，進度在背景任務查看。
  - 「操作紀錄」：這台機器的操作紀錄（時間、操作者、動作、詳細），例如開關機、規格調整、快照、防火牆與憑證變更。
  - 「進階設定」的「生命週期」顯示到期日、自動關機、閒置偵測與預定刪除；有到期日的個人機器可以按「申請延長到期日」，審核中的延期申請可以「撤銷申請」。
  - 「進階設定」的「防火牆」有以這台機器為中心的拓撲圖與規則表：「新增規則」加規則或發布對外服務，自己加的規則可以用開關停用或刪除，標「由連線管理」的規則鎖定不能在這裡改；這台機器有對外網址時會列在「對外網址」，點了直接開啟。
  - 防火牆卡的拓撲圖可以直接操作：拖機器調整位置（只影響這張圖、不會存起來；放得離別台太近會自動推開）、從機器邊緣拉線到另一個節點開「新增連線」視窗（線的其中一端要是這台機器）、點連線查看內容或刪除。沒有這台機器的管理權時仍可拖動，但不能拉線，圖下會寫「你沒有這台機器的防火牆管理權，連線只能查看」；另一端是你不能管理的機器時，那條連線只能查看，也不能往它拉線。
  - 「進階設定」的「開機選項」（只有虛擬機）：拖移調整開機順序後按「儲存開機順序」（下次開機生效），或選擇 ISO 按「掛載」、「退出」，要從 ISO 開機要把光碟槽排到最前面。
  - 「進階設定」的「登入憑證」：「重設密碼」、「重新產生金鑰」（舊私鑰立刻失效），也可以貼上自己的公鑰按「加入公鑰」或移除；容器要在執行中才能修改憑證，虛擬機改金鑰要重新開機才生效。
  - 「進階設定」的「共享與轉移」：輸入對方的登入信箱按「共享」，對方只能開關機、使用主控台與查看監控，可以「取消共享」；「轉移」把機器交給另一個帳號。課堂機器沒有共享與轉移。
  - 別人共享給你的機器只看得到「總覽」、「監控」，以及「進階設定」裡的生命週期，不能更改設定。
  - 這頁沒有開關機與主控台；按「返回列表」回到我的資源。
elements:
  - use: spec-change-elements
dialogs:
  - id: snapshot
    title: 建立快照
    opened_by: 建立快照
    purpose: 保留目前磁碟狀態，之後可以隨時還原。
    fields:
      - label: 名稱
        help: 例如 snap-2026-07-04，用來辨認這個快照。
        required: true
      - label: 描述
        help: 選填，例如：升級套件前的備份。
    notes:
      - 還原到快照後，快照之後的變更都會消失。
  - id: backup
    title: 建立備份
    opened_by: 建立備份
    purpose: 完整保存這台機器目前的磁碟內容，之後可以整台還原。
    fields:
      - label: 描述
        help: 選填，例如：升級套件前。
    notes:
      - 備份數量有上限，到上限要先刪除舊備份。
      - 有些容器備份期間會暫時關機，完成後自動開回（畫面會提示）；進度可在「背景任務」查看。
      - 還原時機器會先關機，再整台還原成備份當時的狀態，之後的所有變更都會消失；有備份或還原任務在跑時不能再操作。
  - id: reset-password
    title: 重設登入密碼
    opened_by: 重設密碼
    purpose: 讓系統產生一組新密碼，或自己指定。
    fields:
      - label: 系統產生
        help: 預設選項：按「產生新密碼」，新密碼會顯示在卡片上，之後也能到「總覽」查看。
      - label: 自己指定
        help: 切到這個選項後在「新密碼」輸入並按「設定密碼」；平台不保存這組密碼，忘記只能再重設。
      - label: 新密碼
        help: 選「自己指定」時必填：8 到 64 個字元，不能含空白；Windows 機器還要至少包含三類字元（大寫、小寫、數字、符號等），且不能包含帳號名稱 Admin，規則會逐條標出是否已符合。
    notes:
      - 虛擬機執行中時，重設後會自動重新開機套用，請先存好機器內的工作。
      - 容器要在執行中才能重設密碼。
  - id: extend
    title: 申請延長到期日
    opened_by: 申請延長到期日
    purpose: 送出後由管理員審核，核准後到期日與核准使用時段會一起更新。
    fields:
      - label: 新的到期日
        help: 必須晚於目前的到期日；最遠只能選到今天起算 366 天，更長的期限要聯絡管理員。
        required: true
      - label: 申請原因
        help: 說明為什麼需要延長（課程進度、專題時程等），至少 10 個字。
        required: true
    notes:
      - 同一台機器一次只能有一張延期申請在審核中，可以撤銷。
      - 只有設了到期日的個人機器能申請延長；不限期或課堂機器沒有這個按鈕。
  - id: firewall-rule
    title: 新增防火牆規則
    opened_by: 新增規則
    purpose: 替這台機器加一條防火牆規則（對象固定是這一台，不能改選別台），或按「更改連線方式」切到「開放服務給外部」發布網址與 port。
    use: connection-dialog
  - id: transfer
    title: 轉移擁有者
    opened_by: 轉移
    purpose: 把這台機器交給另一個帳號。
    fields:
      - label: 新擁有者的登入信箱
        help: 對方登入 SkyLab 用的 Email。
        required: true
      - label: 轉移後仍保留我的開關機權限
        help: 預設勾選；勾選後你還能開關機與使用主控台。
      - label: 請輸入機器名稱「…」以確認
        help: 引號裡是這台機器的名稱，要一字不差輸入才能按「轉移擁有者」。
        required: true
    notes:
      - 轉移後對方成為擁有者，你會失去所有設定權限。
related:
  - path: /my-resources
    when: 要開關機，或用控制台／終端機連進這台機器
  - path: /my-requests
    when: 要追蹤規格調整或延期申請的審核狀態
  - path: /firewall
    when: 要用拓撲圖一次看所有機器之間的連線
  - path: /jobs
    when: 要看備份、還原或重置任務的進度
