# 建立教學環境（/course-template-management/new）
id: course-template-new
path: /course-template-management/new
title: 建立教學環境
access: staff
order: 220
purpose: 填基本資料、選套用方式並加入機器配置。草稿自動儲存；確認發布後鎖定機器配置，依套用方式提供正式課程、快速練習或兩者。
when_to_use: 正在建立或修改一組教學環境的基本資料與機器配置，準備發布給班級或快速練習使用。
sections:
  - 基本資料
  - 機器配置
features:
  - 「基本資料」：填「環境名稱」與「環境用途」，選「套用方式」（只用於正式課程、只用於快速練習、正式課程與快速練習），可上傳「說明文件」；按「查看機器配置」進入下一步。
  - 「說明文件」：可一次選多個檔案，上傳與移除立即生效，不必另外儲存；點檔名下載，移除前會再確認且無法復原。全新的環境要等草稿第一次自動儲存後才能上傳。
  - 「機器配置」：選「來源方式」——「① 選擇既有範本」後選「既有範本」，或「② 新增 VM/LXC 規格」後選「機器類型」（VM 或 LXC）與「基礎映像」——再按「加入機器」。每位學生最多 3 台，到上限時按鈕變成「已達上限」。只列出已就緒的機器範本。
  - 點拓撲圖上的機器可以改「名稱」（最多 255 字）、「角色」（最多 120 字）與 CPU、RAM、Disk：CPU 1–32 核、RAM 1–64 GB（來源規格更高時上限跟著放寬），Disk 最大 1000 GB、不能小於來源範本或映像的大小（VM 至少 10 GB）。按「移除節點」會連同這台的連線與對外服務一起刪掉。
  - 連線：按「新增連線」，或在拓撲圖上從一台機器拉線到另一台（互通）或拉到網際網路（開放服務給外部），都會開「新增連線」視窗。點一條線可以看細節並刪除；要改就刪掉重拉。
  - 機器預設都能上網；按「上網線」可以顯示或隱藏每台機器連到網際網路的線。
  - 草稿的拓撲圖可以拖動機器排版，放開時記下位置並跟著草稿自動儲存；放得離別台太近會自動推開到最近的空處。
  - 草稿每次修改都會自動儲存；同步失敗時會顯示「草稿尚未同步，請重試；此分頁會保留編輯內容。」，按「重試」再送一次。在同一個瀏覽器分頁不小心離開後再回來，會還原上次未儲存的編輯。
  - 發布：草稿在「機器配置」按「發布」，確認視窗「發布並鎖定」再按「發布」。發布前會檢查環境名稱、機器台數、每台機器的名稱與角色、互通連線與對外服務的條數，以及連線的 port；有問題時會切到該分頁並指出是哪一台、哪一項。
  - 發布後機器配置凍結，拓撲圖與連線只能查看（機器仍可以拖開來看，但位置不會存下來）；「環境名稱」「環境用途」「套用方式」仍可修改，改完按「儲存基本資訊」。機器配置要改就另外建立一個環境。
  - 從建立班級過來時會顯示「班級草稿已保存。」，發布後自動回到原本的班級。按「返回」回到教學環境清單（從班級過來的回到班級）。
elements:
  - id: coursetpl.name
    role: text
    label: 環境名稱
    help: 老師替班級選環境時看到的名稱。草稿可以先空著，發布或按「儲存基本資訊」時沒填會被擋下並標紅。
    constraints:
      - 必填
      - 最多 255 字
    section: 基本資料
  - id: coursetpl.publish
    role: button
    label: 發布
    help: 只有草稿在「機器配置」有這個按鈕。按下後跳出「發布並鎖定」確認視窗，再按「發布」。發布後機器配置不可修改，基本資料仍可改並按「儲存基本資訊」。
    constraints:
      - 環境名稱必填
      - 配置 1 至 3 台機器
      - 每台機器的名稱與角色不可空白
      - 互通連線的 port 要是 1 到 65535
      - 互通連線與對外服務各最多 6 條
    section: 機器配置
  - id: coursetpl.tab
    role: readonly
    label: 目前分頁
    help: 目前所在的步驟：basic 是「基本資料」，machines 是「機器配置」。
  - id: coursetpl.status
    role: readonly
    label: 目前環境狀態
    help: draft 是草稿（可編輯、會自動儲存），published 是已發布（機器配置已鎖定），loading 是還在讀取。
  - id: coursetpl.node_count
    role: readonly
    label: 機器數量
    help: 目前配置的機器台數，上限 3 台。
  - id: coursetpl.return_to_class
    role: readonly
    label: 發布後返回班級
    help: true 表示是從建立班級過來的，發布後會自動回到那個班級。
  - id: coursetpl.tab_basic
    role: list
    label: 基本資料
    help: 第一步：環境名稱、套用方式、環境用途與說明文件。
    section: 基本資料
  - id: coursetpl.usage_scope
    role: select
    label: 套用方式
    help: 決定這組環境提供給誰。含正式課程的，發布後才會出現在建立班級可選的環境裡；含快速練習的，發布後所有登入的使用者都能在快速練習開啟。已發布也能改，改完按「儲存基本資訊」；收窄之後，已經在跑的環境會照原本的期限走完。
    constraints:
      - 只用於正式課程／只用於快速練習／正式課程與快速練習
    section: 基本資料
  - id: coursetpl.description
    role: textarea
    label: 環境用途
    help: 這組環境的說明；清單的搜尋也會比對這裡的文字。
    constraints:
      - 最多 2000 字
    section: 基本資料
  - id: coursetpl.files
    role: list
    label: 說明文件
    help: 附給這組環境的文件，上傳與移除立即生效，不跟著草稿儲存；點檔名下載。
    constraints:
      - 環境建立後才能上傳文件（草稿第一次自動儲存後）
      - 單一檔案最大 50 MB
    section: 基本資料
  - id: coursetpl.save_basics
    role: button
    label: 儲存基本資訊
    help: 只有已發布的環境會出現。已發布的環境不會自動儲存，改完環境名稱、環境用途或套用方式要按這顆才送出；沒有修改時不能按。
    section: 基本資料
  - id: coursetpl.tab_machines
    role: list
    label: 機器配置
    help: 定義這組環境包含哪些機器與機器之間的連線；每位學生最多三台。
    section: 機器配置
  - id: coursetpl.source_mode
    role: select
    label: 來源方式
    help: 「① 選擇既有範本」用已就緒的機器範本；「② 新增 VM/LXC 規格」改選機器類型與基礎映像。
    constraints:
      - ① 選擇既有範本／② 新增 VM/LXC 規格
    section: 機器配置
  - id: coursetpl.add_machine
    role: button
    label: 加入機器
    help: 把選好的來源加成一台機器；要先選來源，已達 3 台或已發布時不能按。
    section: 機器配置
  - id: coursetpl.add_connection
    role: button
    label: 新增連線
    help: 開「新增連線」視窗，設定兩台機器互通或開放服務給外部；還沒有機器或已發布時不能按。
    section: 機器配置
dialogs:
  - id: connection
    title: 新增連線
    opened_by: 新增連線
    purpose: 設定這組環境裡機器之間的互通，或把某台機器的服務開放給外部。也可以在拓撲圖上拉線開啟，兩端會自動帶入。
    fields:
      - label: 你要做什麼？
        help: 課程環境只有兩種：「開放服務給外部」或「讓兩台機器互通」（機器預設就能上網）。從拓撲圖拉線開啟時會依兩端自動選好。
        required: true
      - label: 哪台機器
        help: 「開放服務給外部」時，選要開放服務的機器。
      - label: 從哪台
        help: 「讓兩台機器互通」時，選發起連線的機器。
      - label: 連到哪台
        help: 「讓兩台機器互通」時，選被連的機器，不能和「從哪台」相同。
      - label: 方向
        help: 互通時選「單向」或「雙向」；雙向已包含反方向，不必再加一條。
      - label: 怎麼開放
        help: 開放服務給外部時選「用網址」或「用對外 port」；課程環境沒有「僅開放防火牆」。還沒設定對外網域時只能用對外 port。
      - label: 你的服務跑在哪個 port？
        help: 用網址時填服務在機器裡監聽的 port（1 到 65535），例如網站常見 80。
      - label: 網址前綴
        help: 用網址時必填；只能用小寫英數字與連字號、頭尾不可是連字號，最長 40 字。開課時每位學生在前綴後面接 16 碼亂碼成為自己的網址。
      - label: 網址結尾
        help: 用網址時選要用的網域。
      - label: 啟用 HTTPS（使用管理員設定的憑證）
        help: 用網址時可勾選，預設已勾選。
      - label: Port
        help: 用對外 port 時填服務在機器裡的 port 並選 tcp 或 udp，對外 port 開課時每位學生自動配一個；互通時填要開放的 port 並選協定。可按「新增 port」一次加多列。
    notes:
      - 課程環境的連線必須指定 port，不支援 icmp 這類無埠協定。
      - 用網址發布時只填網址前綴，開課時系統會替每位學生在前綴後面接 16 碼亂碼組成網址；前綴和別條對外服務重複也沒關係。
      - 同一台機器的同一個 port 只能有一條對外服務；兩台之間已有涵蓋同一個 port 的連線時會提示不用再加。
      - 互通連線與對外服務各最多 6 條；會超過時視窗裡直接提示，要先刪掉不需要的再加。
      - 按「加入環境設定」只會加進這份草稿、跟著草稿自動儲存，不會立刻改動任何機器。
related:
  - path: /templates
    when: 需要先把單台機器做成範本當來源
  - path: /course-template-management
    when: 回到教學環境清單
  - path: /class-setup
    when: 環境發布後要開班（套用方式要含正式課程）
  - path: /quick-create
    when: 要確認快速練習的學生端看到什麼
