# 首頁（/dashboard）
id: dashboard
path: /dashboard
title: 首頁
access: all
order: 10
purpose: 依身分顯示不同的首頁：學生看自己的機器、加入的課堂與快速練習環境；老師看進行中的班級、下一堂課與近期班級；管理員看資源概況、AI 維運助手與需要處理的事項。
when_to_use: 剛登入、想知道今天該做什麼，或想從總覽直接跳到要處理的地方。
sections:
  - 我的機器
  - 目前加入的課堂
  - 快速練習環境
  - 近期班級
  - AI 維運助手
  - 現在就處理
  - 排進今天
features:
  - 學生：「我的機器」最多列四台機器，照「我的資源」的順序排，不會依最近使用重排；每張卡片上的小面板會寫出你在這個瀏覽器上次連線的時間。按「進入機器」連進執行中的機器，關機中的按「啟動並進入」會先開機再連線；執行中的機器可以按關機鈕（會先確認），資訊鈕前往這台機器的資源詳情頁。使用時段還沒開始或已結束的機器不能開機，按鈕會改成「時段尚未開始」或「使用時段已結束」。
  - 學生：「目前加入的課堂」每張票是一門課（也就是你所在的班級），顯示上課狀態、老師、日期、時間與教室；點票進入課程，「查看所有課程」看全部課程。
  - 學生：「快速練習環境」列出老師開放的練習環境，點一下查看內容並建立；「建立自己的研究環境」的「填寫申請」直接開啟機器申請表單；「我的資源」按鈕看自己所有的機器。
  - 老師：「進行中的班級」卡顯示上課中的班級數與還在準備中（設定中、等待審核、建立中、部分失敗）的班級數，點了前往班級管理；「下一堂課」卡顯示最近一堂課的日期與班級，點了直接進入那個班級；「近期班級」列出最近要上課的四個班級（日期、時間、學生人數、每位學生的機器數、班級狀態、機器就緒比例），點一下進入那個班級，「全部班級」看所有班級；「建立班級」開新班級。
  - 管理員：資源概況卡顯示節點上線數與 VM、LXC 的執行中數量，點節點卡前往資源監控、點 VM 或 LXC 卡前往資源管理。
  - 管理員：在「AI 維運助手」輸入問題按「開始詢問」，或點建議問題帶入；對話開始後可以「放大對話」、「回到總覽」或「重新問一題」。
  - 管理員：「現在就處理」列出節點與機器的資源異常、未解除的告警、疑似挖礦事件待處置與失敗或受阻的背景任務，點一下前往對應頁面，「查看平台監控」看完整監控；「排進今天」列出等待審核的機器申請（含規格調整與延期）、班級批量建機與 AI API 申請，點一下前往對應的審核清單。
  - 管理員：資料不齊全時會標示「部分狀態無法確認」、「無法取得最新資料」等狀態，旁邊是資料的更新時間，系統會自動重試。
elements:
  - id: dashboard.issues
    role: list
    label: 現在就處理
    help: 管理員身分才看得到：服務已經受影響、該立刻處理的事項。機器異常點進去是那台機器的詳細頁，節點異常與疑似挖礦事件前往資源監控，失敗或受阻的任務前往背景任務。
    section: 現在就處理
  - id: dashboard.today
    role: list
    label: 排進今天
    help: 管理員身分才看得到：有人在等待審核的申請（機器申請、班級批量建機、AI API 申請），點一下前往對應的審核清單。
    section: 排進今天
  - id: dashboard.assistant
    role: text
    label: AI 維運助手
    help: 管理員身分才看得到：描述問題或輸入要檢查的 VM，按「開始詢問」直接在首頁對話。
    section: AI 維運助手
  - id: dashboard.recent_machines
    role: list
    label: 我的機器
    help: 學生身分會看到自己的機器（最多四台），可以直接進入、開機進入或關機。
    section: 我的機器
  - id: dashboard.courses
    role: list
    label: 目前加入的課堂
    help: 學生身分會看到自己加入的課程，點票進入課程頁。還沒有可以上課的班級時顯示「你的班級可以上課後，課程會出現在這裡」。
    section: 目前加入的課堂
  - id: dashboard.quick_templates
    role: list
    label: 快速練習環境
    help: 學生身分會看到老師開放的快速練習環境，點一下查看內容並建立。
    section: 快速練習環境
  - id: dashboard.research
    role: button
    label: 建立自己的研究環境
    help: 學生身分會看到：按「填寫申請」直接開啟機器申請表單。
  - id: dashboard.checkpoints
    role: list
    label: 近期班級
    help: 老師身分會看到最近要上課的班級；班級在準備中時會提示「繼續設定」，上課中的班級顯示機器就緒比例。
    section: 近期班級
  - id: dashboard.create_class
    role: button
    label: 建立班級
    help: 老師身分會看到：開一個新班級。
related:
  - path: /my-resources
    when: 要操作自己的機器（開關機、連線）
  - path: /my-requests
    when: 要申請新機器或查看申請進度
  - path: /quick-create
    when: 想立刻開一組練習環境，不等審核
  - path: /class-management
    when: 老師要管理班級與上課
  - path: /monitoring
    when: 管理員要看節點與機器的完整監控
  - path: /request-review
    when: 管理員要審核等待中的機器申請
