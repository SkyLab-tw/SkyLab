# 防火牆頁的「新增連線」、規則面板與資源詳細的「新增規則」共用同一個 ConnectionDialog（一般模式）。
# 教學環境編輯頁用的是模板模式（只有兩種意圖、欄位不同），自己寫欄位，不引用這個片段。
fields:
  - label: 你要做什麼？
    help: 視窗一開是四張卡片（沒有這行標題），選一張：開放服務給外部、讓機器能上網、讓兩台機器互通、自己寫規則（進階，直接寫一條 Proxmox 防火牆規則，不會出現在拓撲圖上）。選好後收成一行，點那一行（標著「更改連線方式」）可以重選；後面的欄位依選擇改變。從防火牆拓撲拉線或按「新增規則」開啟時會先選好。
    required: true
  - label: 哪台機器
    help: 「開放服務給外部」「讓機器能上網」「自己寫規則」要選的機器。選單只列出你能管理防火牆的機器，每台後面都附上機器來源，別人的機器另外附上擁有者；從某台機器的「新增規則」開啟時固定是那台、不能改。
    required: true
  - label: 從哪台
    help: 只在「讓兩台機器互通」出現：發起連線的機器。
    required: true
  - label: 連到哪台
    help: 只在「讓兩台機器互通」出現：被連的機器，「Port」欄填的是這台要開放的 port；不能和「從哪台」同一台。
    required: true
  - label: 方向
    help: 「讓兩台機器互通」時選單向（只有「從哪台」能連到「連到哪台」）或雙向；「自己寫規則」時選進站或出站。
  - label: 怎麼開放
    help: 只在「開放服務給外部」出現，三選一：用網址、用對外 port、僅開放防火牆。網址可用時預設用網址，否則預設用對外 port；管理員還沒完成網域或 Gateway 設定時不會出現「用網址」。
  - label: 你的服務跑在哪個 port？
    help: 「用網址」時填服務在機器裡監聽的 port，預設 80，也可以從常用 port 選（例如 80 網頁伺服器、3000 Node.js、5000 Flask、8000 FastAPI／Django）；必須是 1 到 65535。
  - label: 啟用 HTTPS（使用管理員設定的憑證）
    help: 「用網址」時出現，預設勾選。
  - label: 網址開頭（自己取名）
    help: 「用網址」時填，例如 myapp；留空代表直接用主網址。輸入後會即時檢查網址能不能用，已被使用時不能送出。
  - label: 網址結尾
    help: 「用網址」時從管理員開放的網域選一個，和網址開頭組成完整網址。
  - label: 允許 Google 等搜尋引擎收錄這個網址
    help: 「用網址」時可勾，預設不收錄；想讓別人搜尋得到的個人網站或作品再勾。不收錄只是請搜尋引擎不要列出，知道網址的人仍然連得到。
  - label: 對外 port
    help: 「用對外 port」時每列填一組，別人用「校園入口 IP:對外 port」連進來；按「新增對應」加一列，至少要填一組，已被使用的 port 會提示換一個。
  - label: 內部 port
    help: 「用對外 port」時填服務在機器裡實際監聽的 port，例如 SSH 是 22；對外 port 會轉到這裡。
  - label: 協定
    help: 「用對外 port」可選 tcp 或 udp；「僅開放防火牆」與「讓兩台機器互通」可選 tcp、udp、icmp、icmpv6、sctp（icmp 類不需要 port）；「自己寫規則」可選任意、tcp、udp、icmp。
  - label: Port
    help: 「僅開放防火牆」與「讓兩台機器互通」每列填一個 1 到 65535 的 port，按「新增 port」加一列，至少要填一個；「自己寫規則」可填單一 port（22）或範圍（8000:8010），協定選任意或 icmp 時不能填。
  - label: 動作
    help: 「自己寫規則」時選允許、丟棄或拒絕，預設允許。
  - label: 來源 IP 或網段
    help: 「自己寫規則」且方向是進站時填，留空代表不限制；例如 10.10.0.0/24 只允許校內網段。
  - label: 目的 IP 或網段
    help: 「自己寫規則」且方向是出站時填（取代「來源 IP 或網段」），留空代表不限制。
  - label: 備註
    help: 「自己寫規則」時選填，寫這條規則是做什麼的。
notes:
  - 送出按鈕依選擇不同：開放服務給外部是「發布」，讓機器能上網與讓兩台機器互通是「建立連線」，自己寫規則是「新增規則」；選自己寫規則時視窗標題變成「新增防火牆規則」。
  - 「讓機器能上網」只要選機器，會開放這台機器連到網際網路的出站連線，不限 port。
  - 「僅開放防火牆」直接在防火牆開放這些 port，不做網址或 port 轉發；規則會被系統追蹤並顯示在拓撲圖上。
  - 「自己寫規則」建的規則不會出現在拓撲圖上；寫成進站、允許、不限來源又有 port 時，視窗會提示改用「開放服務給外部」的「僅開放防火牆」，那樣才會被系統追蹤。
  - 網址或對外 port 已被使用時會提示換一個。
  - 「用網址」選項沒出現，代表管理員還沒完成網域或 Gateway 設定，只能用對外 port 或僅開放防火牆。
  - 一次發布多個 port 時若中途失敗，已成功的會保留，表單只留下還沒完成的那幾列，修正後再送出即可。
